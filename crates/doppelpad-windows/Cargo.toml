[package]
name = "doppelpad-windows"
description = "Windows backend for doppelpad: a Rust client for the DoppelPad UMDF2 virtual HID driver."
version = "0.1.0"
readme = "../../README.md"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gamepad", "controller", "virtual", "hid", "windows"]
categories = ["hardware-support", "os::windows-apis"]

[dependencies]
doppelpad = { path = "../doppelpad", version = "0.1.0" }

# The crate is Windows-only, so docs.rs must build it for a Windows target.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
]

# Cursor + XInput APIs used by the integration test and the xbox_gamepad example.
[target.'cfg(windows)'.dev-dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_XboxController",
]
